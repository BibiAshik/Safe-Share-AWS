# ============================================
# SafeShare — Application Configuration (Production/Main)
# By default this will run as production unless
# SPRING_PROFILES_ACTIVE=local is specified.
# ============================================

spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# ---- Server ----
server.port=8080
# Tell Spring Boot it is behind Nginx / AWS ALB and should honor X-Forwarded-* headers.
server.forward-headers-strategy=framework

# ---- App Settings ----
# Must match your public domain (e.g., https://safeshare.yourdomain.com)
app.base-url=${APP_BASE_URL}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${APP_BASE_URL}}

# ---- Database (AWS RDS) ----
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# In production, NEVER use 'update' or 'create'. Use 'validate' or 'none'
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# ---- Database Migrations ----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---- Redis (AWS ElastiCache) ----
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}

# ---- HTTP Session (Redis-backed for multi-container deployments) ----
spring.session.store-type=redis
spring.session.redis.namespace=safeshare:session
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

# ---- File Upload ----
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# ---- AWS S3 ----
aws.s3.bucket=${AWS_S3_BUCKET}
aws.s3.region=${AWS_REGION}

# ---- JWT ----
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# ---- Google OAuth2 ----
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ---- Mail ----
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ---- Swagger / OpenAPI ----
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:false}
