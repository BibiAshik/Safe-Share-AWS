<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SafeShare — Access a shared file securely.">
    <title>Shared File — SafeShare</title>
    <link rel="icon" href="/images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/mobile.css">
</head>
<body>
    <div class="share-page">
        <!-- Header -->
        <div style="padding:16px 24px;background:var(--bg-primary);border-bottom:1px solid var(--border-color)">
            <div style="max-width:600px;margin:0 auto;text-align:center">
                <a href="/">
                    <img src="/images/icon.png" alt="SafeShare" style="height:32px">
                </a>
            </div>
        </div>

        <div class="share-container">
            <div class="share-card">
                <div class="share-card-body">

                    <!-- Status Section (expired/revoked/not found) -->
                    <div id="statusSection">
                        <div class="share-status">
                            <div class="status-icon warning">⏳</div>
                            <h3>Loading...</h3>
                            <p>Validating this share link...</p>
                        </div>
                    </div>

                    <!-- Password Section -->
                    <div id="passwordSection" class="hidden">
                        <div class="password-section">
                            <div class="lock-icon">🔒</div>
                            <h3>Password Protected</h3>
                            <p id="protectedFileName">This file requires a password to access.</p>
                            <form id="passwordForm">
                                <div class="form-group">
                                    <input type="password" class="form-control" id="linkPassword"
                                           placeholder="Enter password" required style="text-align:center">
                                    <div class="form-error" id="passwordError"></div>
                                </div>
                                <button type="submit" class="btn btn-primary btn-lg" style="width:100%">Unlock</button>
                            </form>
                        </div>
                    </div>

                    <!-- Content Section (preview + download) -->
                    <div id="contentSection" class="hidden">
                        <div style="text-align:center;margin-bottom:16px">
                            <h2 style="font-size:18px;font-weight:700" id="fileName">File</h2>
                        </div>

                        <!-- Preview Area -->
                        <div class="preview-area hidden" id="previewArea">
                            <!-- Populated by download.js -->
                        </div>

                        <!-- Download Button -->
                        <div class="download-section">
                            <button class="btn btn-primary btn-lg" id="downloadBtn">
                                ⬇ Download File
                            </button>
                        </div>
                    </div>

                </div>
            </div>

            <!-- Footer -->
            <div style="text-align:center;padding:24px 0;font-size:12px;color:var(--text-muted)">
                Powered by <strong>SafeShare</strong> — Secure File Sharing
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/download.js"></script>
</body>
</html>
