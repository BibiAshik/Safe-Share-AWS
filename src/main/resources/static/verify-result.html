<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification - SafeShare</title>
    <link rel="icon" href="/images/favicon.png">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/mobile.css">
</head>
<body>
    <div class="landing-page" style="align-items: center; justify-content: center; padding: 20px;">
        <div class="modal" style="position:relative;transform:none;text-align:center;width:100%;max-width:400px;margin:auto;">
            <img src="/images/icon.png" alt="SafeShare" style="height:56px;margin:0 auto 18px">
            <h2 id="verifyTitle">Email Verified</h2>
            <p class="text-muted" id="verifyMessage" style="margin:12px 0 24px">Verification successful. You can now login to SafeShare.</p>
            <a class="btn btn-primary btn-lg" href="/index.html" style="width:100%">Go to Login</a>
        </div>
    </div>

    <script>
        const status = new URLSearchParams(window.location.search).get('status');
        if (status !== 'success') {
            document.getElementById('verifyTitle').textContent = 'Verification Link Expired';
            document.getElementById('verifyMessage').textContent = 'This verification link is invalid or expired. Please register again or request a fresh verification email.';
        }
    </script>
</body>
</html>
