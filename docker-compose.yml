services:
  safeshare-app:
    build: .
    container_name: safeshare-app
    env_file:
      - .env
    expose:
      - "8080"
    restart: unless-stopped
    networks:
      - safeshare-network

  nginx:
    image: nginx:alpine
    container_name: safeshare-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - safeshare-app
    restart: unless-stopped
    networks:
      - safeshare-network

networks:
  safeshare-network:
    driver: bridge  

