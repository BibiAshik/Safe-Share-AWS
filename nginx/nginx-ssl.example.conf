events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    server {
        listen 80;
        server_name safeshare.yourdomain.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name safeshare.yourdomain.com;

        ssl_certificate /etc/letsencrypt/live/safeshare.yourdomain.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/safeshare.yourdomain.com/privkey.pem;

        client_max_body_size 25M;

        location / {
            proxy_pass http://safeshare-app:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
