events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    map $http_x_forwarded_proto $proxy_x_forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    map $http_x_forwarded_port $proxy_x_forwarded_port {
        default $http_x_forwarded_port;
        ""      $server_port;
    }

    # Basic performance tweaks
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Rate limiting for Nginx (optional, as Bucket4j handles app-level)
    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;

    server {
        listen 80;
        server_name _; # Catch-all. Use your domain when terminating TLS directly in Nginx.

        # Max file upload size (must match Spring Boot config)
        client_max_body_size 25M;

        location / {
            proxy_pass http://safeshare-app:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            # These headers are CRITICAL for Spring Boot to know it's behind a proxy
            # and to properly generate HTTPS redirect URLs for Google OAuth.
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $proxy_x_forwarded_port;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Optional: Apply basic nginx rate limiting
            # limit_req zone=mylimit burst=20 nodelay;
        }

        # Error pages
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
