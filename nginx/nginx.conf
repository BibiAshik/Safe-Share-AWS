
events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $http_x_forwarded_proto $proxy_x_forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    map $http_x_forwarded_port $proxy_x_forwarded_port {
        default $http_x_forwarded_port;
        ""      $server_port;
    }

    # Basic performance tweaks
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;

    # HTTP -> HTTPS
    server {
        listen 80;
        server_name safeshare-app.duckdns.org;

        return 301 https://$host$request_uri;
    }

    # HTTPS
    server {
        listen 443 ssl;
        server_name safeshare-app.duckdns.org;

        ssl_certificate /etc/letsencrypt/live/safeshare-app.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/safeshare-app.duckdns.org/privkey.pem;

        # Max file upload size
        client_max_body_size 25M;

        location / {
            proxy_pass http://safeshare-app:8080;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $proxy_x_forwarded_port;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Optional Nginx rate limiting
            # limit_req zone=mylimit burst=20 nodelay;
        }

        error_page 500 502 503 504 /50x.html;

        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
